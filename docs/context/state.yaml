auth:
  accounts_production:
    - "owner@cikidangmedika.com (owner)"
    - "dokter@cikidangmedika.com (dokter_admin)"
  accounts_staging:
    - "owner@cikidangmedika.com (owner)"
    - "dokter@cikidangmedika.com (dokter_admin)"
    - "kasir@cikidangmedika.com (sisa peran lama, perlu ditinjau)"
  password_source: "SEED_PASSWORD_OWNER dan SEED_PASSWORD_DOKTER di .env.staging, .env.production, dan .env.local; semuanya gitignored"
  password_policy: "satu kata sandi per akun, minimal 12 karakter, skrip menolak jika ada dua akun bernilai sama"
  reset_path: "node scripts/seed-auth-users.mjs --env=.env.production --confirm-prod --rotate, atau Supabase Dashboard"
  email_reset_available: false

